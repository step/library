# Whole stack in containers:
#   npm run docker:up        -> Postgres + Neon proxy + migrations + the app on http://localhost:3000
#   npm run docker:down      -> stop (data is kept in the `library_db` volume)
#
# Host ports are remapped so this does not clash with a Postgres on 5432:
#   postgres 5433 -> 5432, neon proxy 4444 -> 4444
#
# Secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, NEXTAUTH_SECRET) and the optional first admin
# (SEED_ADMIN_EMAIL, SEED_ADMIN_NAME) are read from your shell or the `.env` file next to this one.
# DATABASE_URL is always overridden below, so the remote database is never used from here.
x-db-url: &db-url postgres://library:library@db.localtest.me:5432/library

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5433:5432"
    volumes:
      - library_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Translates the Neon driver's HTTP (/sql) and WebSocket (/v2) protocols to plain Postgres.
  # The alias lets containers use the same db.localtest.me host name as the host machine does,
  # which is what src/app/lib/neon-local.ts keys off.
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://library:library@postgres:5432/library
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
        aliases:
          - db.localtest.me

  # One-shot: applies drizzle migrations (and the optional admin seed), then exits.
  migrate:
    build:
      context: .
      target: builder
    command: sh -c "npx drizzle-kit migrate && node scripts/seed-admin.mjs"
    environment:
      DATABASE_URL: postgres://library:library@postgres:5432/library
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: *db-url
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      neon-proxy:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  library_db:
